<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="min-h-screen bg-[#0f1115] text-white flex flex-col items-center py-10">


    <h1 class="text-4xl lg:text-6xl font-bold mb-10 tracking-tight text-white">
        Background Remover
    </h1>


    <label class="relative flex flex-col items-center justify-center 
                  w-5/6 lg:w-2/3 h-72 lg:h-96
                  border border-white/10 rounded-xl
                  bg-[#151821] cursor-pointer overflow-hidden
                  hover:border-white/20 transition">

  
        <svg id="logo" role="img" viewBox="0 0 24 24"
             class="w-16 h-16 text-white/30"
             xmlns="http://www.w3.org/2000/svg">
            <title>Image Toolbox</title>
            <path fill="currentColor" d="M13.995 7.152v1.834q0 .471.32.791t.792.32h1.834q.223 0 .43-.083.21-.085.376-.25l5.78-5.78q.25-.249.362-.57.111-.318.111-.625 0-.305-.125-.61a2 2 0 0 0-.347-.557L22.499.594a1.67 1.67 0 0 0-1.195-.5q-.305 0-.611.111a1.5 1.5 0 0 0-.556.362L14.33 6.346a1.1 1.1 0 0 0-.25.375 1.2 1.2 0 0 0-.084.43Z"/>
        </svg>

   
        <h3 id="logotext" class="mt-4 text-white/60 text-lg">
            Click to Upload Image
        </h3>

        <input type="file" class="hidden" id="imgInput">

       
        <img id="preview"
             class="absolute inset-0 m-auto max-h-full max-w-full object-contain hidden" />
    </label>

   
    <div class="mt-10 w-5/6 lg:w-2/3">

        <h2 class="text-xl font-semibold mb-4 text-white/80">
            Result
        </h2>

        <div class="bg-[#151821] border border-white/10 rounded-xl p-4 flex justify-center items-center min-h-[250px]">

            <img id="resultImg"
                 class="max-w-full max-h-[400px] rounded-lg hidden" />

           

        </div>
    </div>

    <div class="flex gap-4 mt-8">

        <button id="removeBtn"
                class="px-6 py-2 cursor-pointer rounded-lg font-medium
                       bg-white text-black
                       hover:bg-white/90 active:scale-95 transition">
            Remove Background
        </button>

        <a id="downloadLink"
           class="px-6 py-2 rounded-lg font-medium
                  border border-white/20 text-white/80
                  hover:bg-white/10 active:scale-95 transition"
           download>
            Download
        </a>

    </div>

    <script src="app.js"></script>
</body>
</html>
